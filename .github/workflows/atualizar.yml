name: Atualizar Painel Brasil e publicar

on:
  schedule:
    # Minuto 17 de cada hora (UTC), evitando pico de carga do minuto zero.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel-brasil-hourly
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o coletor
        run: python -m unittest discover -s tests -v
      - name: Atualizar manchetes RSS
        run: python scripts/update.py
      - name: Importar edição histórica do Claude
        run: python scripts/import_claude.py
      - name: Arquivar matérias por mês e dia
        run: python scripts/archive.py
      - name: Guardar histórico da coleta
        # Grava o estado publicado para que falhas futuras não apaguem dados recentes.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json site/arquivo
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar Painel Brasil [skip ci]"
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$tentativa" -eq 3 ]; then
                exit 1
              fi
              sleep "$tentativa"
            done
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar o site
        uses: actions/deploy-pages@v4
        id: publicacao
