name: Claude editorial - execucao manual (sem deploy)
# Producao segura: sem agendamento diario nem disparo automatico em push.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-editorial-manual-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  gerar-manualmente:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validacao sem API
        run: python -m unittest discover -s tests -v
      - name: Atualizar fontes RSS
        run: python scripts/update.py
      - name: Gerar perguntas pela Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_MODEL: claude-haiku-5-5
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::error::ANTHROPIC_API_KEY nao configurada'
            exit 1
          fi
          python scripts/claude_enrich.py
      - name: Persistir SOMENTE os dados gerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/news.json site/data/claude-insights.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar Claude sob demanda [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      # Sem deploy. A rotina normal de publicacao da main permanece independente.
