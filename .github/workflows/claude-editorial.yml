name: Claude editorial experimental (sem deploy)

on:
  workflow_dispatch:
  # Apenas quando este workflow for aprovado e integrado a main.
  # O agendamento NAO roda para branches de teste.
  schedule:
    - cron: '43 10 * * *'

permissions:
  contents: write

concurrency:
  group: claude-editorial-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  perguntas-editoriais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar antes de gerar
        run: python -m unittest discover -s tests -v
      - name: Importar exportacoes manuais disponiveis
        run: |
          python scripts/import_claude.py
          python scripts/import_artifacts.py
      - name: Coletar titulares RSS para referencias atualizadas
        run: python scripts/update.py
      - name: Geracao via API do Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'API nao configurada: sem geracao, dados anteriores preservados.'
          else
            python scripts/claude_enrich.py
          fi
      - name: Registrar resultado SOMENTE na branch em execucao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/news.json site/data/claude-insights.json site/arquivo
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar camada Claude experimental [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      # Propositalmente NAO inclui actions/deploy-pages.
