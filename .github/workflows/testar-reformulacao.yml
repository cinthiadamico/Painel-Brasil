name: Validar reformulacao Claude (sem publicacao)

on:
  push:
    branches:
      - teste/reformulacao-claude-api
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/lab.*'
      - '.github/workflows/testar-reformulacao.yml'
      - '.github/workflows/claude-editorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes Python (inclui importacao e API simulada)
        run: python -m unittest discover -s tests -v
      - name: Validar scripts e frontend
        run: |
          python -m compileall -q scripts
          node --check site/lab.js
      - name: Validar selecao editorial sem acesso externo
        run: python scripts/claude_enrich.py --dry-run
