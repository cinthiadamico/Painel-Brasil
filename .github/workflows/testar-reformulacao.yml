name: Validar reformulacao Claude (sem publicacao)

on:
  push:
    branches:
      - teste/reformulacao-claude-api
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/lab.*'
      - '.github/workflows/testar-reformulacao.yml'
      - '.github/workflows/claude-editorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes Python (inclui importacao e API simulada)
        run: python -m unittest discover -s tests -v
      - name: Validar scripts e frontend
        run: |
          python -m compileall -q scripts
          node --check site/lab.js
      - name: Validar selecao editorial sem acesso externo
        run: python scripts/claude_enrich.py --dry-run
      - name: Testar interface em Chrome headless (desktop e celular)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          python -m http.server 8000 --bind 127.0.0.1 --directory site >/tmp/painel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tests/smoke_lab.mjs
      - name: Capturas do laboratorio (somente artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painel-brasil-capturas
          path: qa/screenshots/
          retention-days: 14
          if-no-files-found: ignore
      - name: Empacotar interface para revisao (sem deploy)
        uses: actions/upload-artifact@v4
        with:
          name: painel-brasil-preview
          path: site/
          retention-days: 14
          if-no-files-found: error
